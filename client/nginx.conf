server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets for faster loads.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Cache hashed static assets aggressively — CRA fingerprints filenames,
    # so a new deploy naturally gets new URLs; no need to ever revalidate.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router uses BrowserRouter (real URL paths, not #hash routes),
    # so nginx must fall back to index.html for any path it doesn't
    # recognise as a real file — otherwise refreshing /selectbus or
    # /myticket directly returns a raw 404 from nginx instead of the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
