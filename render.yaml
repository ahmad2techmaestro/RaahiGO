# Render Blueprint — creates the API web service from this repo (New → Blueprint).
# Secrets are marked sync:false, so Render asks for them in the dashboard instead of reading them from git.
services:
  - type: web
    name: raahigo-api
    runtime: node
    rootDir: server
    buildCommand: npm ci --legacy-peer-deps
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false            # your Netlify URL, e.g. https://raahigo.netlify.app
      - key: PAYMENT_MODE
        value: demo            # switch to "razorpay" once RAZORPAY_* keys are set
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: REDIS_URL
        sync: false            # optional (Upstash free tier works)
      - key: ANTHROPIC_API_KEY
        sync: false            # optional
