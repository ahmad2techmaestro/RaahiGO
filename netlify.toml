# Netlify configuration for RaahiGo React frontend

[build]
command = "npm --prefix client ci && npm --prefix client run build"
publish = "client/build"

[build.environment]
NODE_VERSION = "20"
CI = "false"
GENERATE_SOURCEMAP = "false"

# React Router fallback

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

# Cache static assets

[[headers]]
for = "/static/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
