# Netlify settings for the React client (Create React App).

[build]
command = "npm --prefix client run build"
publish = "client/build"

[build.environment]
NODE_VERSION = "20"
CI = "false"
GENERATE_SOURCEMAP = "false"

# React BrowserRouter fallback

[[redirects]]
from = "/*"
to = "/index.html"
status = 200

[[headers]]
for = "/static/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
